<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MZEEMZIMA MUSIC - Online</title>
<style>
:root{--bg:#0a0a0f;--card:#1a1a24;--accent:#f5c518;--text:#fff;--muted:#9aa0b3}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:90px}
header{padding:20px;text-align:center;background:linear-gradient(180deg,#1c1c2b,#0a0a0f);position:sticky;top:0;z-index:10}
header h1{font-size:22px;letter-spacing:2px}
header p{color:var(--muted);font-size:12px;margin-top:4px}
.search-wrap{padding:12px 16px;position:sticky;top:76px;z-index:9;background:var(--bg)}
.search{display:flex;gap:8px}
.search input{flex:1;background:var(--card);border:1px solid #2a2a3a;color:#fff;padding:14px;border-radius:12px;outline:none}
.search button{background:var(--accent);border:0;padding:0 18px;border-radius:12px;font-weight:700;color:#000}
.chips{display:flex;gap:8px;overflow:auto;padding:12px 16px}
.chip{white-space:nowrap;background:#222233;border:1px solid #2a2a3a;padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.list{padding:0 16px;display:grid;gap:10px}
.song{display:flex;gap:12px;align-items:center;background:var(--card);padding:10px;border-radius:14px;border:1px solid #222233}
.song img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.song.meta{flex:1;min-width:0}
.song.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.song.meta span{color:var(--muted);font-size:12px}
.play-btn{width:38px;height:38px;border-radius:50%;background:var(--accent);border:0;display:grid;place-items:center;color:#000;font-size:16px}
.player{position:fixed;left:0;right:0;bottom:0;background:#15151f;border-top:1px solid #2a2a3a;padding:10px 14px;display:flex;gap:12px;align-items:center}
.player img{width:48px;height:48px;border-radius:8px}
.player.p-meta{flex:1;min-width:0}
.player.p-meta b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player audio{width:100%;height:32px;margin-top:4px}
</style>
</head>
<body>
<header>
<h1>MZÉÉMZIMÀ MUSIC</h1>
<p>ONLINE • REAL STREAMING • NO DATA WASTE</p>
</header>
<div class="search-wrap">
<div class="search"><input id="q" placeholder="Search any artist e.g. Bien, Diamond"><button onclick="doSearch()">GO</button></div>
</div>
<div class="chips" id="chips"></div>
<div class="list" id="list"></div>
<div class="player" id="player" style="display:none">
<img id="pimg" src="">
<div class="p-meta"><b id="ptitle">No song</b><span id="partist" style="color:var(--muted);font-size:11px"></span><audio id="audio" controls></audio></div>
</div>
<script>
const chipsData=["Bien","Diamond Platnumz","Sauti Sol","Nyashinski","Otile Brown","Zuchu","Rayvanny","Harmonize"];
const chipsEl=document.getElementById('chips');const listEl=document.getElementById('list');let currentSongs=[];
function renderChips(){chipsEl.innerHTML=chipsData.map(c=>`<div class="chip" onclick="searchArtist('${c}')">${c}</div>`).join('')}
renderChips();
function searchArtist(name){document.getElementById('q').value=name;doSearch()}
async function doSearch(){const term=document.getElementById('q').value.trim()||'Bien';listEl.innerHTML='<p style="color:#888;padding:20px;text-align:center">Searching...</p>';try{const res=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&limit=30&entity=song`);const data=await res.json();currentSongs=data.results;if(currentSongs.length===0){listEl.innerHTML='<p style="color:#888;padding:20px;text-align:center">No results</p>';return}renderList()}catch(e){listEl.innerHTML='<p style="color:#888;padding:20px">Error: '+e+'</p>'}}
function renderList(){listEl.innerHTML=currentSongs.map((s,i)=>`<div class="song"><img src="${s.artworkUrl100.replace('100x100','200x200')}"><div class="meta"><b>${s.trackName}</b><span>${s.artistName}</span></div><button class="play-btn" onclick="playSong(${i})">▶</button></div>`).join('')}
function playSong(i){const s=currentSongs[i];document.getElementById('player').style.display='flex';document.getElementById('pimg').src=s.artworkUrl100.replace('100x100','200x200');document.getElementById('ptitle').textContent=s.trackName;document.getElementById('partist').textContent=s.artistName;const audio=document.getElementById('audio');audio.src=s.previewUrl;audio.play()}
doSearch();
</script>
</body>
</html>
